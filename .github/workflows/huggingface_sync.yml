name: Sync to Hugging Face Hub
on:
  push:
    branches: ["**"] # Sync all branches
    tags: ["**"]     # Sync all tags

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Prepare a clean directory for the fresh push
          mkdir ../hf_deploy
          # Copy everything to an external folder to avoid self-copy infinite loop
          cp -rp . ../hf_deploy
          
          cd ../hf_deploy
          rm -rf .git
          
          # 2. Init a fresh repo and configure LFS correctly
          git init -b main
          git lfs install
          # Explicitly track binaries to satisfy Hugging Face's server-side hooks
          git lfs track "*.png" "*.jpg" "*.mp3" "*.wasm" "*.ttf" "*.otf"
          
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          git add .
          git commit -m "Clean LFS-enabled deploy from ${{ github.ref_name }} at ${{ github.sha }}"
          
          # 3. Add HF remote and force push to main
          git remote add hf https://Bishal26:$HF_TOKEN@huggingface.co/spaces/Bishal26/chess_game_bishal
          git push hf main:refs/heads/main --force
