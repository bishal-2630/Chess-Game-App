name: Sync to Hugging Face Hub
on:
  push:
    branches: ["**"] # Sync all branches
    tags: ["**"]     # Sync all tags

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure Git
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git config lfs.allowincompletepush true 
          
          # 2. Add HF Remote
          # Note: Bishal26 username and HF_TOKEN are used for auth
          git remote add hf https://Bishal26:$HF_TOKEN@huggingface.co/spaces/Bishal26/chess_game_bishal
          
          # 3. Pull LFS objects before pushing to ensure we have the actual blobs
          git lfs pull
          
          # 4. Force push the current branch to HF main to update the app
          # refs/remotes/origin/${{ github.ref_name }} refers to the branch that triggered the push
          git push hf HEAD:refs/heads/main --force
