name: Sync to Hugging Face Hub
on:
  push:
    branches: ["**"] # Sync all branches
    tags: ["**"]     # Sync all tags

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

          # 1. Prepare a clean directory for the fresh push
          mkdir hf_deploy
          # Copy everything except the .git folder to wipe problematic history
          cp -rn . hf_deploy/
          rm -rf hf_deploy/.git
          
          cd hf_deploy
          
          # 2. Init a fresh repo and commit
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          # Stop tracking LFS for this deployment
          rm -f .gitattributes
          
          git add .
          git commit -m "Clean deploy from ${{ github.ref_name }} at ${{ github.sha }}"
          
          # 3. Add HF remote and force push to main
          git remote add hf https://Bishal26:$HF_TOKEN@huggingface.co/spaces/Bishal26/chess_game_bishal
          git push hf main:refs/heads/main --force
