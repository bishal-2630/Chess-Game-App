name: Sync to Hugging Face hub
on:
  push:
    branches: [main, player-1,2] # Add any other branches you want to sync here

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://bishal-2630:$HF_TOKEN@huggingface.co/spaces/Bishal26/chess-game-app ${{ github.ref_name }}:main
