name: Sync to Hugging Face Hub
on:
  push:
    branches: ["**"] # Sync all branches
    tags: ["**"]     # Sync all tags

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 0. Capture the actual commit message from GitHub
          GIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          
          # 1. Clone the EXISTING HF Space (shallow) to preserve history
          git clone --depth=1 https://Bishal26:$HF_TOKEN@huggingface.co/spaces/Bishal26/chess_game_bishal ../hf_deploy || \
            (mkdir ../hf_deploy && cd ../hf_deploy && git init -b main && git remote add origin https://Bishal26:$HF_TOKEN@huggingface.co/spaces/Bishal26/chess_game_bishal)

          # 2. Copy current repo files over the cloned HF repo (preserve .git)
          rsync -a --exclude='.git' . ../hf_deploy/
          
          cd ../hf_deploy

          # 3. Configure LFS for binary files
          git lfs install
          git lfs track "*.png" "*.jpg" "*.mp3" "*.wasm" "*.ttf" "*.otf"

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # 4. Stage and commit on top of existing history
          git add .
          git diff --cached --quiet || git commit -m "Sync: $GIT_MSG (at ${{ github.sha }})"

          # 5. Push (no --force, preserves history)
          git push origin main
